<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Internship Applications Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Demo bar. Not part of the product. -->
  <div class="proto">
    <span class="proto__tag">Prototype</span>

    <label class="switch">
      <input type="checkbox" id="showBlank" />
      <span class="switch__track"></span>
      Not Connected
    </label>
  </div>

  <main class="app" role="application" aria-label="Internship Applications Tracker">

    <div class="page">

      <!-- 1. Greeting and period -->
      <header class="masthead reveal" style="--i:0">
        <div class="masthead__row">
          <h1 class="greeting">Welcome back, <span>Micah</span></h1>
          <button class="icon-btn" id="refreshBtn" type="button" aria-label="Refresh">
            <i data-lucide="refresh-cw"></i>
          </button>
          <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings">
            <i data-lucide="settings"></i>
          </button>
        </div>
        <p class="period"><span class="period__pill">August 2026 to May 2027</span></p>
      </header>

      <!-- 2. Search, sort, filter -->
      <div class="toolbar reveal" style="--i:1">
        <div class="field">
          <i data-lucide="search" class="field__icon"></i>
          <input id="search" type="search" autocomplete="off" spellcheck="false"
                 placeholder="Search Companies, Roles, or Emails&hellip;" aria-label="Search applications" />
          <kbd class="field__kbd">/</kbd>
        </div>

        <div class="toolbar__controls">
          <div class="menu-wrap">
            <button class="ctrl" id="sortBtn" type="button" aria-haspopup="true" aria-expanded="false">
              <i data-lucide="arrow-up-down"></i><span>Sort</span>
            </button>
            <div class="menu" id="sortMenu" role="menu" hidden>
              <p class="menu__label">Sort By</p>
              <button class="menu__item" role="menuitemradio" data-sort="company-asc"><i data-lucide="check"></i>Company &middot; A to Z</button>
              <button class="menu__item" role="menuitemradio" data-sort="company-desc"><i data-lucide="check"></i>Company &middot; Z to A</button>
              <button class="menu__item" role="menuitemradio" data-sort="recent"><i data-lucide="check"></i>Last Activity</button>
              <button class="menu__item" role="menuitemradio" data-sort="emails"><i data-lucide="check"></i>Most Emails</button>
            </div>
          </div>

          <div class="menu-wrap">
            <button class="ctrl" id="filterBtn" type="button" aria-haspopup="true" aria-expanded="false">
              <i data-lucide="sliders-horizontal"></i><span>Filter</span>
              <span class="ctrl__count" id="filterCount" hidden>0</span>
            </button>
            <div class="menu menu--wide" id="filterMenu" role="menu" hidden>
              <p class="menu__label">Term</p>
              <button class="menu__item" role="menuitemcheckbox" data-filter="season" data-value="Summer"><i data-lucide="check"></i>Summer</button>
              <button class="menu__item" role="menuitemcheckbox" data-filter="season" data-value="Spring"><i data-lucide="check"></i>Spring</button>
              <button class="menu__item" role="menuitemcheckbox" data-filter="season" data-value="Fall"><i data-lucide="check"></i>Fall</button>
              <p class="menu__label menu__label--sep">Year</p>
              <button class="menu__item" role="menuitemcheckbox" data-filter="year" data-value="2026"><i data-lucide="check"></i>2026</button>
              <button class="menu__item" role="menuitemcheckbox" data-filter="year" data-value="2027"><i data-lucide="check"></i>2027</button>
              <div class="menu__foot">
                <button class="menu__clear" type="button" id="clearFilters">
                  <i data-lucide="rotate-ccw"></i>Clear Filters
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Replaces the whole board while no inbox is connected -->
      <div class="blank" id="disconnected" hidden>
        <span class="blank__icon"><i data-lucide="unplug"></i></span>
        <p class="blank__title">Not Connected</p>
        <p class="blank__text" id="blankText">Add an API key to read your inbox.</p>
        <button class="btn" id="openFromBlank" type="button">
          <i data-lucide="settings"></i>Open Settings
        </button>
      </div>

      <!-- 3, 4, 5. Sections, rows, and the emails inside them -->
      <div id="board" class="board"></div>

      <p class="empty" id="empty" hidden>
        <i data-lucide="inbox"></i>
        <span>No applications match <b id="emptyTerm"></b></span>
      </p>

      <footer class="footer reveal" style="--i:6">
        <span id="tally"></span>
        <button class="linkish" type="button" id="toggleAll">Expand All</button>
      </footer>
    </div>
  </main>

  <!-- Settings modal -->
  <div class="modal" id="settings" hidden>
    <div class="modal__scrim" data-close></div>

    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <header class="modal__head">
        <h2 class="modal__title" id="settingsTitle">Settings</h2>
        <button class="icon-btn modal__close" type="button" data-close aria-label="Close Settings">
          <i data-lucide="x"></i>
        </button>
      </header>

      <!-- Gmail account -->
      <section class="group">
        <div class="group__head">
          <span class="group__label">Gmail Account</span>
        </div>

        <div class="account">
          <span class="account__avatar" id="accountAvatar">M</span>
          <span class="account__mail" id="accountMail">micah@gmail.com</span>
          <button class="icon-btn icon-btn--sm" id="accountAction" type="button"
                  aria-label="Log Out" title="Log Out">
            <i data-lucide="log-out"></i>
          </button>
        </div>
      </section>

      <!-- API key -->
      <section class="group">
        <div class="group__head">
          <label class="group__label" for="apiKey">API Key <abbr class="req" title="Required">*</abbr></label>
        </div>

        <div class="key-row">
          <div class="field field--key">
            <i data-lucide="key-round" class="field__icon"></i>
            <input id="apiKey" type="password" placeholder="sk-&hellip;" autocomplete="off" spellcheck="false" />
            <button class="icon-btn icon-btn--sm" id="revealKey" type="button" aria-label="Show Key">
              <i data-lucide="eye"></i>
            </button>
          </div>
          <button class="btn" id="checkKey" type="button" disabled>Check</button>
        </div>

        <p class="status" id="keyStatus" data-state="idle" role="status"></p>

        <p class="usage">Usage <span id="usageValue">$2.12</span></p>
      </section>

      <!-- How far back to read -->
      <section class="group">
        <div class="group__head">
          <label class="group__label" for="startDate">Read Emails From <abbr class="req" title="Required">*</abbr></label>
        </div>

        <div class="date-row">
          <span class="date-row__label">Starting</span>
          <input class="date-input" id="startDate" type="date" />
          <span class="date-row__end">to Today</span>
        </div>
        <p class="group__hint" id="dateHint">Within the last year.</p>
      </section>

      <footer class="modal__foot">
        <button class="btn btn--ghost" type="button" data-close id="cancelSettings">Cancel</button>
        <button class="btn btn--primary" type="button" id="saveSettings" disabled>Save</button>
      </footer>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="app.js"></script>
</body>
</html>
