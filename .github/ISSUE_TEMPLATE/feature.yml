name: Feature request
description: Something the app should do and does not
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        `CONTRIBUTING.md` lists what this project takes. The short version:
        it stays local, it has no login, and it calls nothing beyond Gmail and
        your model provider.

        **Do not paste real email content.**

  - type: textarea
    id: problem
    attributes:
      label: What is the problem
      description: What you were trying to do when you wanted this.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What should happen instead
    validations:
      required: true
